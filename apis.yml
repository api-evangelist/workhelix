name: Workhelix
description: Workhelix is an enterprise platform for measuring and growing the return
  on investment of AI initiatives. Its Nucleus product connects workforce data and
  AI usage history to rank AI opportunities by impact, identify high-performing superusers,
  surface adoption gaps, and estimate time and cost savings. The company was co-founded
  by economists Erik Brynjolfsson (Stanford) and Andrew McAfee (MIT) with CEO James
  Milin and research director Daniel Rock (Wharton), is backed by Bloomberg Beta,
  and serves enterprise customers including Autodesk, Nasdaq, and LogicMonitor. Workhelix
  publishes no public API or developer program as of July 2026.
